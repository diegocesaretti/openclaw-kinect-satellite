name: Windows build and publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release and attach the Windows ZIP
        required: true
        type: boolean
        default: false
      version:
        description: Release tag (must match the project version)
        required: true
        type: string
        default: v0.1.0
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/OpenClaw.KinectSatellite/OpenClaw.KinectSatellite.csproj
  PUBLISH_DIR: artifacts/publish
  ZIP_PATH: artifacts/OpenClaw-Kinect-Satellite-win-x86.zip

jobs:
  build-publish:
    name: Test and publish win-x86
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        shell: pwsh
        run: dotnet restore OpenClaw.KinectSatellite.sln --runtime win-x86

      - name: Test
        shell: pwsh
        run: dotnet test tests/OpenClaw.KinectSatellite.Tests/OpenClaw.KinectSatellite.Tests.csproj --configuration Release --no-restore --runtime win-x86 --logger "console;verbosity=normal"

      - name: Publish self-contained Windows application
        shell: pwsh
        run: >-
          dotnet publish $env:PROJECT
          --configuration Release
          --runtime win-x86
          --self-contained true
          --no-restore
          --output $env:PUBLISH_DIR
          -p:PublishProfile=win-x86-self-contained

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:PUBLISH_DIR "OpenClaw.KinectSatellite.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Publish did not produce $exe"
          }
          @("models\wake-word-catalog.json", "models\THIRD-PARTY-NOTICES.md") | ForEach-Object {
            if (-not (Test-Path (Join-Path $env:PUBLISH_DIR $_) -PathType Leaf)) {
              throw "Publish is missing required wake-word catalog metadata: $_"
            }
          }
          Get-ChildItem $env:PUBLISH_DIR -Recurse | Format-Table FullName, Length

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:ZIP_PATH) | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $env:ZIP_PATH -CompressionLevel Optimal -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Kinect-Satellite-win-x86
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        id: release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "${{ inputs.version }}" }
          if ($version -ne "v0.1.0") {
            throw "This project currently publishes v0.1.0; received '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release.outputs.version }}"
          if (gh release view $version --repo "${{ github.repository }}" 2>$null) {
            gh release upload $version "$env:ZIP_PATH#OpenClaw Kinect Satellite win-x86" --repo "${{ github.repository }}" --clobber
            gh release edit $version --repo "${{ github.repository }}" --title "OpenClaw Kinect Satellite $version" --notes-file ".github/release-notes-v0.1.0.md"
          }
          else {
            gh release create $version "$env:ZIP_PATH#OpenClaw Kinect Satellite win-x86" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "OpenClaw Kinect Satellite $version" --notes-file ".github/release-notes-v0.1.0.md"
          }
